name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    env:
      RUNNER: ${{ secrets.RUNNER }}
      TEST_USER_NAME: ${{ secrets.TEST_USER_NAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      NOP_COMMERCE_TEST_USERNAME: ${{ secrets.NOP_COMMERCE_TEST_USERNAME }}
      NOP_COMMERCE_TEST_PASSWORD: ${{ secrets.NOP_COMMERCE_TEST_PASSWORD }}
      RES_RES_API_KEY: ${{ secrets.RES_RES_API_KEY }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npm run test:make-apt
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
